  }
}

mutation _Testing_CreateManager(
  $user_key: String!
  $person: UUID!
  $org_unit: UUID!
  $manager_type: UUID!
  $manager_level: UUID!
  $responsibility: [UUID!]!
  $from_date: DateTime!
  $engagement: UUID
) {
  manager_create(
    input: {
      user_key: $user_key
      person: $person
      org_unit: $org_unit
      manager_type: $manager_type
      manager_level: $manager_level
      responsibility: $responsibility
