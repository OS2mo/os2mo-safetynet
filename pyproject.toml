[tool.poetry]
name = "os2mo-safetynet"
version = "0.0.0"
description = "Application for generating SafetyNet reports"
authors = ["Magenta ApS <info@magenta.dk>"]
license = "MPL-2.0"
readme = "README.md"
package-mode = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = "^3.12"
gql = "^3"
pydantic = {version = "^1", extras=["email"]}
more-itertools = "^9"
uvicorn = "^0.34"
structlog = "^25"
fastramqpi = "^15"
websockets = "^13" # for ariadne
httpx = "^0.27"
fastapi = "^0.115"
starlette = "^0.41"
tenacity = "^8"
ramodels = "^39"
graphql-core = "^3"
async-lru = "^2.0.5"
paramiko = "^2.8.1"

[tool.poetry.group.pre-commit.dependencies]
pre-commit = "^3"
ruff = "^0.9"
deptry = "^0.23"
mypy = "^1"
types-paramiko = "^2.8.1"

[tool.poetry.group.test.dependencies]
pytest = "^8.4"
pytest-asyncio = "^1.4"
pytest-cov = "^5"
pytest-split = "^0.9"
freezegun = "^1"
time-machine = "^3"
asgi-lifespan = "^2.1"

[tool.poetry.group.dev.dependencies]
ariadne-codegen = "^0.7"

[tool.mypy]
plugins = "pydantic.mypy, pydantic.v1.mypy"

[tool.ariadne-codegen]
target_package_name = "autogenerated_graphql_client"
target_package_path = "safetynet/"
client_name = "GraphQLClient"
schema_path = "schema.graphql"  # curl -O http://localhost:5000/graphql/v30/schema.graphql
queries_path = "queries.graphql"
include_all_inputs = false
include_all_enums = false
include_comments = false
plugins = [
    # Return values directly when only a single top field is requested
    "ariadne_codegen.contrib.shorter_results.ShorterResultsPlugin",
    # Add UNSET and UnsetType to generated input types
    "fastramqpi.ariadne.UnsetInputTypesPlugin",
]
[tool.ariadne-codegen.scalars.DateTime]
type = "datetime.datetime"
parse = "fastramqpi.ariadne.parse_graphql_datetime"
[tool.ariadne-codegen.scalars.UUID]
type = "uuid.UUID"
[tool.ariadne-codegen.scalars.CPR]
type = "..types.CPRNumber"

[tool.pytest.ini_options]
collect_imported_tests = false
asyncio_mode="auto"

[tool.ruff]
target-version = "py312"
# The ariadne-codegen output is regenerated, not hand-edited; keep ruff away
# from it so formatting does not fight with regeneration.
extend-exclude = ["safetynet/autogenerated_graphql_client"]

[tool.ruff.lint]
extend-select = [
    # isort
    "I"
]
ignore = [
  # Allow function calls in arguments, like `Depends(...)`
  "B008",
  # Allow lines longer than 90 characters if ruff-format decides so
  "E501"
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.deptry.per_rule_ignores]
DEP002 = [
  # uvicorn is used by the Dockerfile
  "uvicorn",
  # Used by the ariadne-codegen generated GraphQL client / gql websocket transport
  "websockets",
  "httpx",
  "gql",
  "graphql-core",
  # Transitive MO / framework dependencies not imported directly
  "ramodels",
  "async-lru",
  "tenacity",
]
